services:
  widgethub:
    container_name: widgethub
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      icon: https://raw.githubusercontent.com/luisrioja/WidgetsHub/develop/public/vite.svg
      traefik.enable: "false"
