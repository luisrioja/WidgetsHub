<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Widget Hub — a modular instrument panel for the desk." />
    <meta name="theme-color" content="#000000" />
    <title>Widget Hub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Doto:wght@300..800&family=Space+Grotesk:wght@300..700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <script>
      /* Apply the persisted theme before first paint to avoid a flash. */
      (function () {
        try {
          var raw = localStorage.getItem('widgethub-theme');
          var theme = raw ? JSON.parse(raw).state.theme : 'dark';
          var root = document.documentElement;
          root.classList.toggle('dark', theme !== 'light');
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'light' ? '#F5F5F5' : '#000000');
        } catch (e) {
          /* keep the dark default already on <html> */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
