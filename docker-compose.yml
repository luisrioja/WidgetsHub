services:
  widgethub:
    container_name: widgethub
    build:
      context: .
      dockerfile: Dockerfile
    # Kept on 3080 deliberately: the Cloudflare tunnel points here, and moving
    # the port would break the public hostname.
    ports:
      - "3080:3080"
    environment:
      PORT: 3080
      # The owner's email is NOT set here. It lives in data/secrets.json on the
      # host, which is mounted below and never committed — this repo is public.
      # See DEPLOY.md.
    volumes:
      # SQLite database + secrets.json. Survives every rebuild.
      - /DATA/AppData/widgethub/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      icon: https://raw.githubusercontent.com/luisrioja/WidgetsHub/main/public/favicon.svg
      traefik.enable: "false"
